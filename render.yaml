services:
  - type: web
    name: studyconnect-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_LOGGING
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: SWEP PROJECT
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://peer-tutoring-platform-deploy.vercel.app
